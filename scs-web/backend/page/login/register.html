<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>晨哥外卖管理端 - 注册</title>
  <link rel="shortcut icon" href="../../favicon.ico">
  <!-- 引入样式 -->
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/common.css">
  <link rel="stylesheet" href="../../styles/login.css">
  <link rel="stylesheet" href="../../styles/icon/iconfont.css" />
  <style>
    .body{
      min-width: 1366px;
    }
  </style>
</head> 

<body>
  <div class="login" id="register-app">
    <div class="login-box">
      <img src="../../images/login/login-l.png" alt="">
      <div class="login-form">
        <el-form ref="registerForm" :model="registerForm" :rules="registerRules" >
          <div class="login-form-title">
            <img src="../../images/favicon.ico" style="width:120px;height:120px;" alt="" />
          </div>
          <el-form-item prop="username">
            <el-input v-model="registerForm.username" type="text" auto-complete="off" placeholder="账号" maxlength="20"
              prefix-icon="iconfont icon-user" />
          </el-form-item>
          <el-form-item prop="password">
            <el-input v-model="registerForm.password" type="password" placeholder="密码" prefix-icon="iconfont icon-lock" maxlength="20"
              @keyup.enter.native="handleRegister" />
          </el-form-item>
          <el-form-item style="width:100%;">
            <el-button :loading="loading" class="login-btn" size="medium" type="primary" style="width:100%;"
              @click.native.prevent="handleRegister">
              <span v-if="!loading">注册</span>
              <span v-else>注册中...</span>
            </el-button>
          </el-form-item>
          <el-form-item style="width:100%; text-align: center;">
            <el-link type="primary" href="./login.html">已有账号？立即登录</el-link>
          </el-form-item>
        </el-form>
      </div>
    </div>
  </div>

  <!-- 开发环境版本，包含了有帮助的命令行警告 -->
  <script src="../../plugins/vue/vue.js"></script>
  <!-- 引入组件库 -->
  <script src="../../plugins/element-ui/index.js"></script>
  <!-- 引入axios -->
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../js/request.js"></script>
  <script src="../../js/validate.js"></script>
  <script src="../../api/register.js"></script>

  <script>
    new Vue({
      el: '#register-app',
      data() {
        return {
          registerForm:{
            username: '',
            password: ''
          },
          loading: false
        }
      },
      computed: {
        registerRules() {
          const validateUsername = (rule, value, callback) => {
            if (!value || value.length < 1) {
              callback(new Error('请输入账号'))
            } else {
              callback()
            }
          }
          const validatePassword = (rule, value, callback) => {
            if (!value || value.length < 6) {
              callback(new Error('密码必须在6位以上'))
            } else {
              callback()
            }
          }
          return {
            'username': [{ 'validator': validateUsername, 'trigger': 'blur' }],
            'password': [{ 'validator': validatePassword, 'trigger': 'blur' }]
          }
        }
      },
      created() {
      },
      methods: {
        async handleRegister() {
          this.$refs.registerForm.validate(async (valid) => {
            if (valid) {
              try {
                this.loading = true
                let res = await registerApi(this.registerForm)
                console.log('注册结果：', res)
                if (String(res.code) === '1') {
                  ELEMENT.Message({
                    message: '注册成功',
                    type: 'success'
                  })
                  // 注册成功后跳转到登录页
                  setTimeout(() => {
                    window.location.href = './login.html'
                  }, 1500)
                } else {
                  ELEMENT.Message({
                    message: res.msg || '注册失败',
                    type: 'error'
                  })
                  this.loading = false
                }
              } catch (error) {
                console.error('注册错误：', error)
                ELEMENT.Message({
                  message: error.message || '注册异常，请稍后重试',
                  type: 'error'
                })
                this.loading = false
              }
            }
          })
        }
      }

    })
  </script>
</body>

</html>
