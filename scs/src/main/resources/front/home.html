<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0,user-scalable=no,minimal-ui">
    <title>素晨堂餐厅</title>
    <link rel="icon" href="images/favico.ico">
    <!--不同屏幕尺寸根字体设置-->
    <script src="./js/base.js"></script>
    <!--element-ui的样式-->
    <link rel="stylesheet" href="../backend/plugins/element-ui/index.css" />
    <!--引入vant样式-->
    <link rel="stylesheet" href="styles/vant.min.css"/>
    <!-- 引入样式  -->
    <link rel="stylesheet" href="styles/index.css" />
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
        background: #f5f5f5;
      }

      .home-container {
        min-height: 100vh;
        padding-bottom: 70px;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }

      /* 顶部横幅 */
      .banner {
        width: 100%;
        height: 180px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        position: relative;
        overflow: hidden;
      }

      .banner::after {
        content: '';
        position: absolute;
        bottom: -50px;
        left: 0;
        right: 0;
        height: 100px;
        background: #f5f5f5;
        border-radius: 50% 50% 0 0;
      }

      /* 商家信息卡片 */
      .shop-card {
        background: #fff;
        margin: -60px 12px 12px;
        padding: 16px;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        position: relative;
        z-index: 1;
      }

      .shop-header {
        display: flex;
        gap: 12px;
        margin-bottom: 12px;
      }

      .shop-logo {
        width: 70px;
        height: 70px;
        border-radius: 12px;
        flex-shrink: 0;
      }

      .shop-info {
        flex: 1;
        min-width: 0;
      }

      .shop-name {
        font-size: 18px;
        font-weight: bold;
        color: #333;
        margin-bottom: 8px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .shop-stats {
        display: flex;
        gap: 12px;
        font-size: 12px;
        color: #666;
      }

      .stat-item {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .stat-item img {
        width: 14px;
        height: 14px;
      }

      .shop-desc {
        font-size: 13px;
        color: #666;
        line-height: 1.6;
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid #f0f0f0;
      }

      /* 操作按钮 */
      .action-btn {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 12px;
        transition: all 0.3s ease;
      }

      .action-btn:hover {
        opacity: 0.9;
        transform: translateY(-1px);
      }

      .action-btn:active {
        transform: translateY(0);
      }

      /* 推荐菜品列表 */
      .recommend-section {
        background: #fff;
        margin: 12px;
        padding: 16px;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }

      .section-title {
        font-size: 16px;
        font-weight: bold;
        color: #333;
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .section-title::before {
        content: '';
        width: 4px;
        height: 16px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border-radius: 2px;
      }

      .dish-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
        max-height: calc(100vh - 500px);
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding-right: 4px;
      }

      .dish-item {
        display: flex;
        gap: 12px;
        padding: 12px;
        background: #f8f9fa;
        border-radius: 8px;
        transition: all 0.2s ease;
        cursor: pointer;
      }

      .dish-item:hover {
        background: #f0f2f5;
        transform: translateX(4px);
      }

      .dish-item:active {
        transform: translateX(0);
      }

      .dish-image {
        width: 80px;
        height: 80px;
        border-radius: 8px;
        flex-shrink: 0;
        object-fit: cover;
      }

      .dish-info {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .dish-name {
        font-size: 15px;
        font-weight: bold;
        color: #333;
        margin-bottom: 4px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .dish-desc {
        font-size: 12px;
        color: #999;
        margin-bottom: 8px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .dish-bottom {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .dish-price {
        font-size: 18px;
        font-weight: bold;
        color: #ff6b6b;
      }

      .dish-price::before {
        content: '￥';
        font-size: 12px;
      }

      .dish-sales {
        font-size: 12px;
        color: #999;
      }

      /* 底部导航 */
      .bottom-nav {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: #fff;
        box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.08);
        display: flex;
        justify-content: space-around;
        padding: 8px 0;
        z-index: 100;
      }

      .nav-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .nav-item:hover {
        opacity: 0.7;
      }

      .nav-item.active {
        color: #667eea;
      }

      .nav-icon {
        font-size: 24px;
      }

      .nav-text {
        font-size: 12px;
        color: #666;
      }

      .nav-item.active .nav-text {
        color: #667eea;
        font-weight: bold;
      }

      /* AI 助手样式 */
      .ai-assistant-btn {
        position: fixed;
        right: 20px;
        bottom: 100px;
        width: 50px;
        height: 50px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        transition: all 0.3s ease;
        z-index: 9999;
        animation: pulse 2s infinite;
      }

      .ai-assistant-btn:hover {
        transform: scale(1.1);
        box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
      }

      .ai-assistant-btn .icon-ai {
        font-size: 24px;
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
      }

      @keyframes pulse {
        0%, 100% {
          box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        50% {
          box-shadow: 0 4px 25px rgba(102, 126, 234, 0.6);
        }
      }

      .ai-chat-dialog {
        position: fixed;
        right: 20px;
        bottom: 80px;
        width: 340px;
        height: 500px;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
        z-index: 9998;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        animation: slideIn 0.3s ease;
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .ai-chat-header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: #fff;
        padding: 14px 18px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .ai-chat-header h3 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .ai-chat-header .close-btn {
        cursor: pointer;
        font-size: 20px;
        opacity: 0.8;
        transition: opacity 0.2s;
      }

      .ai-chat-header .close-btn:hover {
        opacity: 1;
      }

      .ai-chat-messages {
        flex: 1;
        padding: 14px;
        overflow-y: auto;
        background: #f5f7fa;
      }

      .ai-message {
        margin-bottom: 14px;
        display: flex;
        flex-direction: column;
      }

      .ai-message.user {
        align-items: flex-end;
      }

      .ai-message.assistant {
        align-items: flex-start;
      }

      .message-bubble {
        max-width: 80%;
        padding: 10px 14px;
        border-radius: 12px;
        font-size: 13px;
        line-height: 1.5;
        word-wrap: break-word;
      }

      .ai-message.user .message-bubble {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: #fff;
        border-bottom-right-radius: 4px;
      }

      .ai-message.assistant .message-bubble {
        background: #fff;
        color: #333;
        border-bottom-left-radius: 4px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }

      .message-time {
        font-size: 11px;
        color: #999;
        margin-top: 4px;
        padding: 0 4px;
      }

      .ai-chat-input {
        padding: 14px;
        background: #fff;
        border-top: 1px solid #e8e8e8;
        display: flex;
        gap: 8px;
      }

      .ai-chat-input input {
        flex: 1;
        padding: 9px 12px;
        border: 1px solid #dcdfe6;
        border-radius: 20px;
        outline: none;
        font-size: 13px;
        transition: border-color 0.2s;
      }

      .ai-chat-input input:focus {
        border-color: #667eea;
      }

      .ai-chat-input button {
        width: 36px;
        height: 36px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border: none;
        border-radius: 50%;
        color: #fff;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
      }

      .ai-chat-input button:hover {
        transform: scale(1.05);
      }

      .ai-chat-input button:active {
        transform: scale(0.95);
      }

      .typing-indicator {
        display: flex;
        gap: 4px;
        padding: 10px 14px;
      }

      .typing-indicator span {
        width: 7px;
        height: 7px;
        background: #999;
        border-radius: 50%;
        animation: typing 1.4s infinite;
      }

      .typing-indicator span:nth-child(2) {
        animation-delay: 0.2s;
      }

      .typing-indicator span:nth-child(3) {
        animation-delay: 0.4s;
      }

      @keyframes typing {
        0%, 60%, 100% {
          transform: translateY(0);
        }
        30% {
          transform: translateY(-8px);
        }
      }
    </style>
  </head>
  <body>
    <div id="main" class="app has-bottom-nav">
      <div class="home-container">
        <!-- 顶部横幅 -->
        <div class="banner"></div>

        <!-- 商家信息卡片 -->
        <div class="shop-card">
          <div class="shop-header">
            <img src="../backend/images/login/stu_logo.png" alt="素晨堂餐厅" class="shop-logo"/>
            <div class="shop-info">
              <div class="shop-name">素晨堂餐厅</div>
              <div class="shop-stats">
                <div class="stat-item">
                  <img src="./images/time.png"/>
                  <span>距离1.5km</span>
                </div>
                <div class="stat-item">
                  <img src="./images/money.png"/>
                  <span>配送费6元</span>
                </div>
                <div class="stat-item">
                  <img src="./images/location.png"/>
                  <span>预计12min</span>
                </div>
              </div>
            </div>
          </div>
          <div class="shop-desc">
            素晨堂中餐厅是素晨堂点餐的独立的品牌，定位"大众化的美食外送餐饮"，旨为顾客打造专业美食。
          </div>
          <button class="action-btn" @click="goToMenu">
            🍽️ 进入店铺点餐
          </button>
        </div>

        <!-- 推荐菜品列表 -->
        <div class="recommend-section">
          <div class="section-title">🔥 人气推荐</div>
          <div class="dish-list">
            <div class="dish-item" v-for="(dish, index) in recommendDishes" :key="index" @click="goToMenu">
              <img :src="dish.image" class="dish-image" />
              <div class="dish-info">
                <div class="dish-name">{{ dish.name }}</div>
                <div class="dish-desc">{{ dish.desc }}</div>
                <div class="dish-bottom">
                  <div class="dish-price">{{ dish.price }}</div>
                  <div class="dish-sales">月售{{ dish.sales }}份</div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- 底部导航 -->
        <div class="bottom-nav">
          <div class="nav-item active">
            <div class="nav-icon">🏠</div>
            <div class="nav-text">首页</div>
          </div>
          <div class="nav-item" @click="goToMenu">
            <div class="nav-icon">🍽️</div>
            <div class="nav-text">点餐</div>
          </div>
          <div class="nav-item" @click="toOrderPage">
            <div class="nav-icon">📋</div>
            <div class="nav-text">订单</div>
          </div>
          <div class="nav-item" @click="toUserPage">
            <div class="nav-icon">👤</div>
            <div class="nav-text">我的</div>
          </div>
        </div>
      </div>

      <!-- AI 助手按钮 -->
      <div class="ai-assistant-btn" @click="toggleChat" title="AI 助手">
        <span class="icon-ai">🤖</span>
      </div>

      <!-- AI 聊天对话框 -->
      <div class="ai-chat-dialog" v-if="showChat">
        <div class="ai-chat-header">
          <h3>
            <span>🤖</span>
            AI 智能助手
          </h3>
          <span class="close-btn" @click="toggleChat">×</span>
        </div>

        <div class="ai-chat-messages" ref="messagesContainer">
          <div
            v-for="(msg, index) in messages"
            :key="index"
            class="ai-message"
            :class="msg.role"
          >
            <div class="message-bubble">{{ msg.content }}</div>
            <div class="message-time">{{ msg.time }}</div>
          </div>

          <div v-if="isTyping" class="ai-message assistant">
            <div class="typing-indicator">
              <span></span>
              <span></span>
              <span></span>
            </div>
          </div>
        </div>

        <div class="ai-chat-input">
          <input
            type="text"
            v-model="inputMessage"
            placeholder="输入消息..."
            @keyup.enter="sendMessage"
          />
          <button @click="sendMessage">
            <span style="font-size: 16px;">➤</span>
          </button>
        </div>
      </div>
    </div>

    <!-- 开发环境版本，包含了有帮助的命令行警告 -->
    <script src="../backend/plugins/vue/vue.js"></script>
    <!-- 引入组件库 -->
    <script src="../backend/plugins/element-ui/index.js"></script>
    <!-- 引入vant样式 -->
    <script src="./js/vant.min.js"></script>        
    <!-- 引入axios -->
    <script src="../backend/plugins/axios/axios.min.js"></script>
    <script src="./js/request.js"></script>
    <script src="./js/common.js"></script>
  </body>
  <script>
    new Vue({
      el: '#main',
      data() {
        return {
          // 推荐菜品数据
          recommendDishes: [
            {
              name: '辣子鸡',
              desc: '来自鲜嫩美味的小鸡，值得品尝',
              price: 78,
              sales: 156,
              image: './images/demo1.png'
            },
            {
              name: '毛氏红烧肉',
              desc: '毛氏红烧肉毛氏红烧肉，经典湘菜',
              price: 68,
              sales: 234,
              image: './images/demo2.png'
            },
            {
              name: '组庵鱼翅',
              desc: '组庵鱼翅，看图足以表明一切',
              price: 48,
              sales: 89,
              image: './images/demo3.png'
            },
            {
              name: '霸王别姬',
              desc: '还有什么比霸王别姬更美味的',
              price: 128,
              sales: 312,
              image: './images/demo4.png'
            }
          ],
          // AI 助手相关
          showChat: false,
          inputMessage: '',
          isTyping: false,
          messages: [
            {
              role: 'assistant',
              content: '您好！我是素晨堂餐厅的 AI 智能助手，有什么可以帮助您的吗？',
              time: this.getCurrentTime()
            }
          ]
        }
      },
      mounted() {
      },
      methods: {
        // 跳转到点餐页面
        goToMenu() {
          window.location.href = 'menu.html';
        },

        // 跳转到订单页面
        toOrderPage() {
          window.location.href = 'page/order.html';
        },

        // 跳转到用户页面
        toUserPage() {
          window.location.href = 'page/user.html';
        },

        // AI 助手相关方法
        toggleChat() {
          this.showChat = !this.showChat;
          if (this.showChat) {
            this.$nextTick(() => {
              this.scrollToBottom();
            });
          }
        },

        sendMessage() {
          const message = this.inputMessage.trim();
          if (!message) return;

          // 添加用户消息
          this.messages.push({
            role: 'user',
            content: message,
            time: this.getCurrentTime()
          });

          this.inputMessage = '';
          this.isTyping = true;
          this.scrollToBottom();

          // 创建 AI 回复消息占位
          const aiMessageIndex = this.messages.length;
          this.messages.push({
            role: 'assistant',
            content: '',
            time: this.getCurrentTime()
          });

          // 调用后端 AI 接口（流式响应）
          this.callAIAPI(message, aiMessageIndex);
        },

        callAIAPI(userMessage, messageIndex) {
          fetch('http://120.76.242.12:8067/api/scs/chat', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              message: userMessage
            })
          })
          .then(response => {
            if (!response.ok) {
              throw new Error(`HTTP error! status: ${response.status}`);
            }
        
            const reader = response.body.getReader();
            const decoder = new TextDecoder('utf-8');
            let accumulatedText = '';
            let buffer = '';

            const readStream = () => {
              return reader.read().then(({ done, value }) => {
                if (done) {
                  this.isTyping = false;
                  this.scrollToBottom();
                  return;
                }
        
                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split('\n');
                buffer = lines.pop() || '';

                lines.forEach(line => {
                  const trimmedLine = line.trim();
                  if (!trimmedLine) return;

                  if (trimmedLine.startsWith('data:')) {
                    const data = trimmedLine.substring(5);
                    if (data !== '') {
                      accumulatedText += data;
                      this.$set(this.messages[messageIndex], 'content', accumulatedText);
                      this.scrollToBottom();
                    }
                  }
                });

                return readStream();
              });
            };

            return readStream();
          })
          .catch(error => {
            console.error('AI 接口调用失败:', error);
            this.isTyping = false;

            if (this.messages[messageIndex]) {
              this.$set(this.messages[messageIndex], 'content',
                '抱歉，服务暂时不可用，请稍后重试。');
            } else {
              this.messages.push({
                role: 'assistant',
                content: '抱歉，服务暂时不可用，请稍后重试。',
                time: this.getCurrentTime()
              });
            }

            this.scrollToBottom();
          });
        },

        getCurrentTime() {
          const now = new Date();
          const hours = String(now.getHours()).padStart(2, '0');
          const minutes = String(now.getMinutes()).padStart(2, '0');
          return `${hours}:${minutes}`;
        },

        scrollToBottom() {
          this.$nextTick(() => {
            const container = this.$refs.messagesContainer;
            if (container) {
              container.scrollTop = container.scrollHeight;
            }
          });
        }
      }
    })
  </script>
</html>
